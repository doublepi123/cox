name: Cox checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec vp test run --project root packages --maxWorkers=4
      - run: pnpm --filter @t3tools/client-runtime test
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter cox exec playwright-core install --with-deps --only-shell chromium
      - run: pnpm --filter cox exec vp test run --fileParallelism --maxWorkers=4
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @t3tools/web exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter @t3tools/web exec vp test run --project unit --project browser --maxWorkers=2
  distribution:
    needs: [core, server, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm release:pack
      - run: pnpm test:smoke
      - run: pnpm test:dev-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: cox-distribution
          path: release/*
