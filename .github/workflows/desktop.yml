name: Cox desktop packages
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop/**
      - apps/server/**
      - apps/web/**
      - packages/**
      - scripts/package-npm.ts
      - scripts/npm-postinstall.mjs
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/desktop.yml
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm desktop:test
      - run: pnpm --filter @cox/desktop typecheck
      - run: pnpm desktop:build
      - run: pnpm --filter @cox/desktop smoke
      - run: pnpm --filter @cox/desktop smoke:app
      - uses: actions/upload-artifact@v4
        with:
          name: cox-desktop-${{ matrix.os }}
          path: |
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.exe
            release/desktop/*.blockmap
            release/desktop/*.sha256
            release/desktop/BUILD-*.json
          if-no-files-found: error
