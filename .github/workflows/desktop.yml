name: Cox desktop packages
on:
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build only Windows for Windows-specific changes
        type: boolean
        default: false
  pull_request:
    paths:
      - apps/desktop/**
      - apps/server/**
      - apps/web/**
      - packages/**
      - scripts/package-npm.ts
      - scripts/npm-postinstall.mjs
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/desktop.yml
      - .github/workflows/desktop-release.yml
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        flavor: [bundled, client-only]
        os: ${{ fromJSON(inputs.windows_only && '["windows-2025"]' || '["macos-15","macos-15-intel","windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      COX_DESKTOP_CLIENT_ONLY: ${{ matrix.flavor == 'client-only' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm desktop:test
      - run: pnpm --filter @cox/desktop typecheck
      - run: pnpm desktop:build
      - run: pnpm --filter @cox/desktop verify:mac
        if: runner.os == 'macOS'
      - run: pnpm --filter @cox/desktop smoke
      - run: pnpm --filter @cox/desktop smoke:app
      - uses: actions/upload-artifact@v4
        with:
          name: cox-desktop-${{ matrix.os }}-${{ matrix.flavor }}
          compression-level: 0
          path: |
            release/desktop/${{ matrix.flavor }}/*.dmg
            release/desktop/${{ matrix.flavor }}/*.dmg.sha256
            release/desktop/${{ matrix.flavor }}/*.dmg.blockmap
            release/desktop/${{ matrix.flavor }}/*.dmg.blockmap.sha256
            release/desktop/${{ matrix.flavor }}/*.exe
            release/desktop/${{ matrix.flavor }}/*.exe.sha256
            release/desktop/${{ matrix.flavor }}/*.exe.blockmap
            release/desktop/${{ matrix.flavor }}/*.exe.blockmap.sha256
            release/desktop/${{ matrix.flavor }}/BUILD-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: cox-desktop-${{ matrix.os }}-zip-${{ matrix.flavor }}
          compression-level: 0
          path: |
            release/desktop/${{ matrix.flavor }}/*.zip
            release/desktop/${{ matrix.flavor }}/*.zip.sha256
            release/desktop/${{ matrix.flavor }}/*.zip.blockmap
            release/desktop/${{ matrix.flavor }}/*.zip.blockmap.sha256
            release/desktop/${{ matrix.flavor }}/BUILD-*.json
          if-no-files-found: error
