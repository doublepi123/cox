name: Set up Cox workspace
description: Install the pinned Node and pnpm toolchain and frozen workspace dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: 1.27.3
        cache-dependency-path: native/protocol-bridge/go.sum
    - uses: actions/setup-node@v4
      with:
        node-version: 26.12.1
    - shell: bash
      run: npm install --global pnpm@12.14.0
    - shell: bash
      run: pnpm install --frozen-lockfile
    - shell: bash
      run: node scripts/build-protocol-bridge.ts
